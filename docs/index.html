<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новелла — интерактивные истории</title>
<style>
  :root{--bg:#F6EFE2;--paper:#FFFBF2;--ink:#2E2A24;--muted:#7A6E5C;--accent:#A9803E;--line:#E3D7BF}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:640px;margin:0 auto;padding:56px 20px 64px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:44px 34px;text-align:center}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;margin:10px 0 6px}
  .tag{color:var(--muted);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
  .mark{color:var(--accent);font-size:44px}
  a{color:var(--accent)}
</style>
</head>
<body>
<main>
<div class="card">
  <div class="mark">◆</div>
  <h1>Новелла</h1>
  <p class="tag">Интерактивные истории</p>
  <p>Романтические визуальные новеллы, где каждый твой выбор меняет финал.</p>
  <p><a href="privacy.html">Политика конфиденциальности</a> · <a href="https://github.com/kirillpetrov08/novel">Проект на GitHub</a></p>
</div>
</main>
</body>
</html>
