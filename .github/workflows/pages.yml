name: GitHub Pages (политика конфиденциальности)

# Публикует содержимое docs/ на GitHub Pages:
#   https://kirillpetrov08.github.io/novel/privacy.html
# Запуск — вручную из Actions и при изменениях в docs/.

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment НЕ указываем осознанно: github-pages по умолчанию разрешает деплой
    # только с ветки по умолчанию, а мы деплоим с рабочей ветки arena/*.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
