name: Сборка Android (APK + AAB для RuStore)

# Когда собирать: вручную из вкладки Actions и автоматически при коммите
# новой истории / кода приложения. Результат — артефакты запуска:
#   • novella-debug-apk   — тестовая сборка, ставится прямо на телефон
#   • novella-release-aab — файл для загрузки в RuStore (подписанный, если заданы секреты)
on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "stores/**"
      - "android/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "tools/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Установить зависимости
        run: npm ci

      - name: Проверить истории
        run: npm run validate

      - name: Собрать веб-часть и синхронизировать Android
        run: npm run build:android

      - name: Есть ли ключ подписи в секретах
        id: ks
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "has=$([ -n "$B64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Настроить подпись релиза
        if: steps.ks.outputs.has == 'true'
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$B64" | base64 -d > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PW
          keyAlias=$ALIAS
          keyPassword=$KEY_PW
          EOF

      - name: Предупреждение о неподписанном релизе
        if: steps.ks.outputs.has != 'true'
        run: echo "::warning::Секреты подписи не заданы — AAB будет НЕподписанным. RuStore его не примет. Настройка ключа — в RUSTORE.md, раздел 2."

      - name: Собрать APK (тест) и AAB (RuStore)
        working-directory: android
        run: |
          chmod +x gradlew
          VERSION_NAME=$(node -p "require('../package.json').version")
          ./gradlew :app:assembleDebug :app:bundleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=$VERSION_NAME \
            --stacktrace

      - name: Артефакт — тестовый APK
        uses: actions/upload-artifact@v4
        with:
          name: novella-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Артефакт — AAB для RuStore
        uses: actions/upload-artifact@v4
        with:
          name: novella-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
